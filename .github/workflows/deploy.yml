name: Deploy TBGS to Local PC

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        shell: pwsh
        run: |
          node --version
          pnpm --version

      - name: Write back-end .env
        shell: pwsh
        run: |
          $envContent = @'
          DB_SERVER=${{ secrets.DB_SERVER }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_UID=${{ secrets.DB_UID }}
          DB_PWD=${{ secrets.DB_PWD }}
          PORT=5000
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          NODE_ENV=production
          CORS_URLS=${{ secrets.CORS_URLS }}
          '@
          Set-Content -Path "back-end/.env" -Value $envContent -Encoding ascii

      - name: Write front-end .env
        shell: pwsh
        run: |
          $envContent = @'
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          BASE_PATH=${{ secrets.BASE_PATH }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          '@
          Set-Content -Path "front-end/.env" -Value $envContent -Encoding ascii

      - name: Install + build backend
        shell: pwsh
        working-directory: back-end
        run: |
          pnpm install
          pnpm build

      - name: Install + build frontend
        shell: pwsh
        working-directory: front-end
        run: |
          pnpm install
          pnpm build

      - name: Start / reload PM2 apps
        shell: pwsh
        run: |
          pm2 startOrReload .\ecosystem.config.cjs --update-env
          pm2 save
          pm2 list

      - name: Health check backend
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          $r = Invoke-WebRequest -Uri "http://localhost:5000/" -UseBasicParsing
          Write-Host "Backend HTTP $($r.StatusCode): $($r.Content)"

      - name: Health check frontend
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          $r = Invoke-WebRequest -Uri "http://localhost:3000/tbgs-main" -UseBasicParsing
          Write-Host "Frontend HTTP $($r.StatusCode)"